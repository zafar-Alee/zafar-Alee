<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Zafar Ali — Android Developer</title>
  <desc id="desc">Animated midnight navy and cyan GitHub profile hero banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#102d49"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="typing"><rect x="0" y="0" width="710" height="42"/></clipPath>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <circle cx="1050" cy="70" r="125" fill="#0891b2" opacity=".10"/>
  <circle cx="1100" cy="245" r="95" fill="#38bdf8" opacity=".08"/>
  <path d="M0 252 C220 210 340 300 560 252 S920 215 1200 250" fill="none" stroke="#164e63" stroke-width="2" opacity=".7"/>
  <path d="M0 260 C220 218 340 308 560 260 S920 223 1200 258" fill="none" stroke="url(#line)" stroke-width="2" opacity=".55"/>
  <g fill="#67e8f9" opacity=".7"><circle cx="1010" cy="95" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="1130" cy="150" r="2.5"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle><circle cx="970" cy="215" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle></g>
  <text x="76" y="88" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="4">HELLO, I'M</text>
  <text x="72" y="157" fill="#f0f9ff" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">ZAFAR ALI</text>
  <rect x="76" y="180" width="74" height="4" rx="2" fill="url(#line)"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#bae6fd" clip-path="url(#typing)">
    <text x="76" y="229">Android Developer  <tspan fill="#22d3ee">|</tspan>  Kotlin &amp; Jetpack Compose</text>
  </g>
  <text x="76" y="266" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="2">BUILDING USEFUL THINGS, ONE APP AT A TIME</text>
  <g transform="translate(1000 120)" fill="none" stroke="#67e8f9" stroke-width="3" opacity=".9" filter="url(#glow)">
    <path d="M-38 -28 L-68 0 L-38 28" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/></path>
    <path d="M38 -28 L68 0 L38 28" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values="1;.45;1" dur="2.2s" repeatCount="indefinite"/></path>
    <path d="M12 -42 L-12 42" stroke-linecap="round"/>
  </g>
</svg>
