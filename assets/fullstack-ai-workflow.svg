 <rect x="701" y="431" width="112" height="29" rx="7" fill="#102b27" stroke="#1ba77f"/><text x="757" y="450" text-anchor="middle" class="tag">Deploy</text>
 <path d="M816 445H846" class="request"/>
 <rect x="853" y="431" width="175" height="29" rx="7" fill="#102b27" stroke="#1ba77f"/><text x="940" y="450" text-anchor="middle" class="tag">Monitor &amp; Improve</text>
</g>
<text x="550" y="490" text-anchor="middle" class="eyebrow">SECURE API DESIGN  •  SEPARATION OF CONCERNS  •  AI-AUGMENTED APPLICATIONS</text>
</svg>
